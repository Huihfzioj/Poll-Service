# Datasource config
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-proxy:8080
        isDefault: true
---
# Dashboard provider config
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provider
data:
  default.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards
---
# Dashboard config (your dashboard JSON)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
data:
  poll-dashboard.json: |-
    {
      "title": "Poll Service Dashboard",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "HTTP Request Rate",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{
            "expr": "rate(poll_service_request_count_total[5m])",
            "legendFormat": "{{method}} {{endpoint}}",
            "refId": "A"
          }],
          "fieldConfig": {"defaults": {"unit": "reqps", "min": 0}}
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Request Latency - 95th Percentile",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [{
            "expr": "histogram_quantile(0.95, sum(rate(poll_service_request_latency_seconds_bucket[5m])) by (le, endpoint, method))",
            "legendFormat": "P95 {{method}} {{endpoint}}",
            "refId": "A"
          }],
          "fieldConfig": {"defaults": {"unit": "s", "min": 0}}
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Total Requests",
          "gridPos": {"h": 6, "w": 6, "x": 0, "y": 8},
          "targets": [{
            "expr": "sum(poll_service_request_count_total)",
            "instant": true,
            "refId": "A"
          }],
          "fieldConfig": {"defaults": {"unit": "short"}},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}}
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Avg Request Duration",
          "gridPos": {"h": 6, "w": 6, "x": 6, "y": 8},
          "targets": [{
            "expr": "sum(rate(poll_service_request_latency_seconds_sum[5m])) / sum(rate(poll_service_request_latency_seconds_count[5m]))",
            "legendFormat": "Average",
            "refId": "A"
          }],
          "fieldConfig": {"defaults": {"unit": "ms", "decimals": 1}}
        }
      ],
      "refresh": "10s",
      "time": {"from": "now-15m", "to": "now"}
    }