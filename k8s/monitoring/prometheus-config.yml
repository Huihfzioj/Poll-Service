apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: "poll-service"
        metrics_path: /metrics
        static_configs:
          - targets: ["poll-service.default.svc.cluster.local:8000"]
