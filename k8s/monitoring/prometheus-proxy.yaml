apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-proxy-config
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    
    http {
        upstream prometheus {
            server prometheus:9090;
        }
        
        server {
            listen 8080;
            server_name _;
            
            location / {
                proxy_pass http://prometheus;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                
                # Increase timeout for queries
                proxy_read_timeout 300;
                proxy_connect_timeout 300;
                proxy_send_timeout 300;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-proxy
  template:
    metadata:
      labels:
        app: prometheus-proxy
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
      volumes:
      - name: nginx-config
        configMap:
          name: prometheus-proxy-config
          items:
          - key: nginx.conf
            path: nginx.conf
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-proxy
spec:
  selector:
    app: prometheus-proxy
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
---
# Optional: Add ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-proxy-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: prometheus.127.0.0.1.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus-proxy
            port:
              number: 8080