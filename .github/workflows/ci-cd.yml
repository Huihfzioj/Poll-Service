name: CI-CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r . -ll

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/poll-service:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/poll-service:latest

  deploy-and-observe:
    needs: build-test-scan
    if: |
      github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev') ||
      github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Create kind cluster
        uses: engineerd/setup-kind@v0.6.0

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Install NGINX Ingress
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl wait -n ingress-nginx \
            --for=condition=available deployment/ingress-nginx-controller \
            --timeout=120s

      - name: Deploy monitoring stack
        run: |
          # Deploy Prometheus (config + deployment)
          kubectl apply -f k8s/prometheus-config.yaml
          kubectl apply -f k8s/prometheus-deployment.yaml
          
          # Deploy Prometheus proxy if you have it
          if [ -f "k8s/prometheus-proxy.yaml" ]; then
            kubectl apply -f k8s/prometheus-proxy.yaml
          fi
          
          # Deploy Grafana config and deployment
          kubectl apply -f k8s/grafana-config.yaml
          kubectl apply -f k8s/grafana-deployment.yaml

      - name: Deploy application
        run: |
          sed "s|IMAGE_PLACEHOLDER|${{ secrets.DOCKERHUB_USERNAME }}/poll-service:latest|g" \
            k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Wait for all resources
        run: |
          kubectl wait --for=condition=available deployment/poll-service --timeout=120s
          kubectl wait --for=condition=available deployment/prometheus --timeout=60s
          kubectl wait --for=condition=available deployment/grafana --timeout=60s

      - name: Port-forward ingress
        run: |
          kubectl port-forward -n ingress-nginx svc/ingress-nginx-controller 8080:80 &
          # Also port-forward Grafana for testing
          kubectl port-forward svc/grafana 3000:3000 &
          sleep 15

      - name: Functional test
        run: |
          # Test app
          curl -f http://localhost:8080/health \
            -H "Host: poll.127.0.0.1.nip.io"
          
          # Test Grafana
          curl -f http://localhost:3000/api/health

      - name: Prometheus metrics validation
        run: |
          echo "=== Checking app metrics endpoint ==="
          curl -s http://localhost:8080/metrics \
            -H "Host: poll.127.0.0.1.nip.io" | grep -E "poll_service_request_count_total|poll_service_request_latency_seconds"
          
          echo -e "\n=== Checking Prometheus can scrape metrics ==="
          # Wait for Prometheus to scrape
          sleep 30
          # Query Prometheus through proxy if exists, otherwise direct
          if kubectl get svc prometheus-proxy >/dev/null 2>&1; then
            kubectl port-forward svc/prometheus-proxy 9091:8080 &
            sleep 5
            curl -s "http://localhost:9091/api/v1/query?query=poll_service_request_count_total" | grep -q '"status":"success"'
          else
            kubectl port-forward svc/prometheus 9090:9090 &
            sleep 5
            curl -s "http://localhost:9090/api/v1/query?query=poll_service_request_count_total" | grep -q '"status":"success"'
          fi

      - name: Verify Grafana dashboard
        run: |
          echo "=== Verifying Grafana datasource ==="
          # Get Grafana admin credentials
          ADMIN_USER="admin"
          ADMIN_PASS="admin"  # Change if different in your config
          
          # Get datasources
          curl -s -u "$ADMIN_USER:$ADMIN_PASS" http://localhost:3000/api/datasources | grep -q "Prometheus"
          
          echo "=== Checking dashboards ==="
          curl -s -u "$ADMIN_USER:$ADMIN_PASS" http://localhost:3000/api/search | grep -q "poll"

      - name: DAST scan (ZAP)
        run: |
          docker run --network host \
            zaproxy/zap-stable zap-baseline.py \
            -t http://localhost:8080 \
            -r zap-report.html || true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: zap-report.html
          
      - name: Generate monitoring status
        if: always()
        run: |
          echo "=== Monitoring Stack Status ===" > monitoring-status.txt
          echo "Time: $(date)" >> monitoring-status.txt
          echo -e "\n=== Pods ===" >> monitoring-status.txt
          kubectl get pods >> monitoring-status.txt
          echo -e "\n=== Services ===" >> monitoring-status.txt
          kubectl get svc >> monitoring-status.txt
          echo -e "\n=== Deployments ===" >> monitoring-status.txt
          kubectl get deployments >> monitoring-status.txt
      
      - name: Upload monitoring status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-status
          path: monitoring-status.txt
          retention-days: 7