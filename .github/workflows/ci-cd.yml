name: CI-CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build-test-scan-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Run Bandit security scan
        run: |
          pip install bandit
          bandit -r . -ll

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Ensure Docker Hub repo exists
        run: |
          curl -s -o /dev/null -w "%{http_code}" -u "${{ secrets.DOCKERHUB_USERNAME }}:${{ secrets.DOCKERHUB_TOKEN }}" \
          -X POST https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/poll-service/ \
          -H "Content-Type: application/json" \
          -d '{"namespace":"${{ secrets.DOCKERHUB_USERNAME }}","name":"poll-service","is_private":false}'

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/poll-service:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/poll-service:latest

      - name: Start FastAPI app
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5  # wait for server to start
