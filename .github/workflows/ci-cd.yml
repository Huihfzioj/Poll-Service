name: CI-CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Run Bandit security scan
        run: |
          pip install bandit
          bandit -r . -ll

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/poll-service:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/poll-service:latest

  deploy-to-kind:
    needs: build-test-scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Kind Cluster
        uses: engineerd/setup-kind@v0.6.0
        with:
          version: "v0.20.0"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Install Ingress NGINX
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=90s

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Wait for service readiness
        run: |
          chmod +x scripts/wait-for-service.sh
          ./scripts/wait-for-service.sh poll-service default 8000 120

      - name: Run DAST Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://poll.127.0.0.1.nip.io
          cmd_options: "-I"
          fail_action: false
          allow_issue_writing: false

      - name: Upload ZAP reports
        uses: actions/upload-artifact@v4
        with:
          name: zapreports
          path: |
            report_json.json
            report_md.md
            report_html.html